[project]
name = "tribute-protocol"
description = "Tribute Protocol - Programmable Patronage on Bitcoin"
authors = ["Tribute Protocol"]
telemetry = true
cache_dir = "./.cache"

# Local trait contracts (for devnet testing only)
[contracts.sip-009-trait]
path = "contracts/traits/sip-009-trait.clar"

[contracts.sip-010-trait]
path = "contracts/traits/sip-010-trait.clar"

# Core protocol contracts
[contracts.registry]
path = "contracts/registry.clar"

[contracts.splitter]
path = "contracts/splitter.clar"

[contracts.badge-nft]
path = "contracts/badge-nft.clar"
depends_on = ["sip-009-trait"]

# Requirements for testnet/mainnet - use official deployed traits
[[project.requirements]]
contract_id = "SP2PABAF9FTAJYNFZH93XENAJ8FVY99RRM50D2JG9.nft-trait"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

# Check-checker settings:
# trusted_sender: if true, inputs are trusted after tx_sender has been checked.
# trusted_caller: if true, inputs are trusted after contract-caller has been checked.
# callee_filter: if true, untrusted data may be passed into a private function without a
# warning, if it gets checked inside. This check will also propagate up to the
# caller.
# More informations: https://www.hiro.so/blog/new-safety-checks-in-clarinet
